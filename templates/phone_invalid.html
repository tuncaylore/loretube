<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bağlantı geçersiz · LoreFlow</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light; --paper: #f7f7f8; --surface: #ffffff; --ink: #1f1f23; --ink-2: #74747d; --rule: #e8e8ec; --accent-strong: #d91e2b; --radius: 16px; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; overflow-x: clip; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    main {
      width: min(100%, 26rem);
      background: var(--surface);
      border: 1px solid var(--rule);
      border-radius: var(--radius);
      padding: 24px;
    }
    .brand { margin: 0 0 24px; font-weight: 700; font-size: 15px; }
    .brand span { color: var(--accent-strong); }
    h1 { margin: 0 0 8px; font-size: 22px; line-height: 1.25; }
    p { margin: 0; color: var(--ink-2); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <p class="brand">Lore<span>Flow</span></p>
    <h1>Bağlantı kullanılamıyor</h1>
    <p>{{ reason }} Bilgisayarınızdaki LoreFlow penceresinden yeni bir QR kod oluşturun.</p>
  </main>
</body>
</html>
